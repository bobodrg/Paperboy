name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Backend, All]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / device / OS
